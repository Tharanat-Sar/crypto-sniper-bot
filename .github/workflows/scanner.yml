name: Crypto Sniper Scanner

on:
  schedule:
    # รันทุก 15 นาที ช่วง 14:00 - 23:45 น. เวลาไทย (07:00 - 16:45 UTC)
    - cron: '*/15 7-16 * * *'
  workflow_dispatch:

permissions:
  contents: write  # ให้สิทธิ์เซฟไฟล์ผลการเทรดกลับเข้า GitHub

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Libraries
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas openai requests python-dotenv

      - name: Execute Scanner
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python sniper_scanner.py

      - name: Commit and Push Trade Log
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add trades.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update paper trading ledger [skip ci]" && git push)