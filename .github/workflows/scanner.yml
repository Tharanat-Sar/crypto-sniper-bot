name: Crypto Sniper Scanner

on:
  schedule:
    # รันทุก 15 นาที ช่วง 14:00 - 23:45 น. เวลาไทย (07:00 - 16:45 UTC)
    - cron: '*/15 7-16 * * *'
  workflow_dispatch: # ปุ่มกดสั่งรันมือทดสอบได้

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Libraries
        run: |
          python -m pip install --upgrade pip
          pip install ccxt pandas openai requests python-dotenv

      - name: Execute Scanner
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python sniper_scanner.py